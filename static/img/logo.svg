<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 50" width="240" height="50">
  <defs>
    <linearGradient id="logoTealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="logoBox" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
  </defs>
  <!-- Mark -->
  <g transform="translate(4, 5)">
    <!-- Box Body -->
    <rect x="2" y="15" width="34" height="23" rx="5" fill="url(#logoBox)" stroke="#38bdf8" stroke-width="1.5"/>
    <rect x="9" y="14" width="20" height="3" rx="1.5" fill="#0d9488"/>
    <!-- Ballot Paper -->
    <rect x="10" y="3" width="18" height="15" rx="2" fill="#ffffff"/>
    <!-- Checkmark on ballot -->
    <path d="M14 10.5 L17.5 14 L24 7.5" fill="none" stroke="url(#logoTealGrad)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Text -->
  <text x="52" y="32" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif" font-weight="800" font-size="22" fill="#0f172a" letter-spacing="-0.5">
    Ballot<tspan fill="#0d9488">Bridge</tspan>
  </text>
  <text x="53" y="44" font-family="'Plus Jakarta Sans', sans-serif" font-weight="600" font-size="8.5" fill="#64748b" letter-spacing="1.2">
    SECURE E-VOTING
  </text>
</svg>
